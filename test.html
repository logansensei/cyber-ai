<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - CyberSentinel AI</title>
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        .test-section h2 {
            color: #00d4ff;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .btn {
            background: linear-gradient(135deg, #00d4ff, #ff6b6b);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="test-section">
        <h2>🛡️ CyberSentinel AI - Test Page</h2>
        <p>If you can see this with proper styling, the CSS is working.</p>
        <button class="btn">Test Button</button>
    </div>
    
    <div class="test-section">
        <h2>CSS Test</h2>
        <p>This should have a dark background with glass morphism effects.</p>
    </div>
</body>
</html>
